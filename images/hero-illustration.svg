<svg width="420" height="380" viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Laptop base -->
  <rect x="70" y="60" width="280" height="190" rx="14" fill="#1E293B"/>
  <rect x="84" y="74" width="252" height="162" rx="6" fill="#0F172A"/>

  <!-- Screen content: code lines -->
  <rect x="100" y="92" width="120" height="8" rx="4" fill="url(#screenGrad)"/>
  <rect x="100" y="110" width="180" height="8" rx="4" fill="#334155"/>
  <rect x="100" y="128" width="90" height="8" rx="4" fill="#334155"/>
  <rect x="120" y="146" width="150" height="8" rx="4" fill="url(#screenGrad)"/>
  <rect x="120" y="164" width="100" height="8" rx="4" fill="#334155"/>
  <rect x="100" y="182" width="200" height="8" rx="4" fill="#334155"/>
  <rect x="100" y="200" width="70" height="8" rx="4" fill="url(#screenGrad)"/>

  <!-- Laptop keyboard base -->
  <path d="M40 250 L380 250 L360 290 L60 290 Z" fill="#E2E8F0"/>
  <rect x="180" y="256" width="60" height="6" rx="3" fill="#94A3B8"/>

  <!-- Floating shapes -->
  <circle cx="70" cy="300" r="14" fill="#DBEAFE"/>
  <circle cx="360" cy="300" r="10" fill="#BFDBFE"/>
  <rect x="30" y="40" width="26" height="26" rx="8" fill="#EFF4FF" stroke="#2563EB" stroke-width="2"/>
  <rect x="360" y="30" width="20" height="20" rx="6" fill="#EFF4FF" stroke="#2563EB" stroke-width="2"/>
</svg>
